<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seven Gigs</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <meta name="description" content="Practical tips, AI tools, and tutorials for freelancers, written from real Upwork experience.">
  <meta property="og:site_name" content="Seven Gigs">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seven Gigs">
  <meta property="og:description" content="Practical tips, AI tools, and tutorials for freelancers, written from real Upwork experience.">
  <meta property="og:url" content="https://seven25-ui.github.io/seven-gigs/post.html">
  <meta property="og:image" content="https://seven25-ui.github.io/seven-gigs/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="index.html"><img class="logo-mark" src="logo-mark.svg" alt="" width="36" height="36"><span>Seven <b>Gigs</b></span></a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
      <nav aria-label="Main" id="mainNav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap post" id="post">
    <p class="empty">Loading...</p>
  </main>

  <footer class="foot">
    <div class="wrap foot-grid">
      <div>
        <a class="logo" href="index.html"><img class="logo-mark" src="logo-mark.svg" alt="" width="36" height="36"><span>Seven <b>Gigs</b></span></a>
        <p>Tips, AI tools, and tutorials for freelancers.</p>
      </div>
      <nav aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms &amp; Disclaimer</a>
      </nav>
    </div>
    <div class="wrap copy">&copy; <span id="yr">2026</span> Seven Gigs. All rights reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();

    (async function () {
      const box = document.getElementById("post");
      const notFound = '<a class="back" href="index.html">&larr; Back to all posts</a><p class="empty">This post could not be found.</p>';
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { box.innerHTML = notFound; return; }

      // If a static page was built for this post, go there (better for Google and faster to load)
      try {
        const r = await fetch("posts/slugs.json", { cache: "no-store" });
        if (r.ok) {
          const map = await r.json();
          if (map[id]) { location.replace("posts/" + map[id] + ".html"); return; }
        }
      } catch (e) { /* fall through to the dynamic version */ }

      const { data, error } = await sb
        .from("gigs_posts")
        .select("title,category,excerpt,content,created_at")
        .eq("id", id)
        .eq("published", true)
        .maybeSingle();

      if (error || !data) { box.innerHTML = notFound; return; }

      document.title = data.title + " | Seven Gigs";
      if (data.excerpt) {
        let m = document.querySelector('meta[name="description"]');
        if (!m) { m = document.createElement("meta"); m.name = "description"; document.head.appendChild(m); }
        m.content = data.excerpt;
      }

      const words = String(data.content).trim().split(/\s+/).length;
      const mins = Math.max(1, Math.round(words / 200));
      const url = location.href.split("#")[0];
      const enc = encodeURIComponent;

      box.innerHTML = `
        <a class="back" href="index.html">&larr; Back to all posts</a><br>
        <span class="tag">${esc(data.category)}</span>
        <h1>${esc(data.title)}</h1>
        <div class="meta">${fmtDate(data.created_at)} &middot; ${mins} min read</div>
        <article class="body">${renderContent(data.content)}</article>
        <div class="share">
          <strong>Share this post</strong>
          <a href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}" target="_blank" rel="noopener">Facebook</a>
          <a href="https://twitter.com/intent/tweet?url=${enc(url)}&amp;text=${enc(data.title)}" target="_blank" rel="noopener">X</a>
          <a href="https://t.me/share/url?url=${enc(url)}&amp;text=${enc(data.title)}" target="_blank" rel="noopener">Telegram</a>
          <a href="https://wa.me/?text=${enc(data.title + " " + url)}" target="_blank" rel="noopener">WhatsApp</a>
          <button type="button" id="copyLink">Copy link</button>
        </div>
        <section class="related" id="related"></section>`;

      document.getElementById("copyLink").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        try { await navigator.clipboard.writeText(url); btn.textContent = "Copied!"; }
        catch (err) { btn.textContent = "Press Ctrl+C to copy the address bar"; }
        setTimeout(() => { btn.textContent = "Copy link"; }, 2000);
      });

      // Related posts: same category first, then the newest others
      const rel = await sb
        .from("gigs_posts")
        .select("id,title,category,created_at")
        .eq("published", true)
        .neq("id", id)
        .order("created_at", { ascending: false })
        .limit(12);
      if (!rel.error && rel.data && rel.data.length) {
        const sorted = [
          ...rel.data.filter(p => p.category === data.category),
          ...rel.data.filter(p => p.category !== data.category)
        ].slice(0, 3);
        document.getElementById("related").innerHTML =
          "<h2>Keep reading</h2>" +
          sorted.map(p => `
            <a class="rel" href="post.html?id=${encodeURIComponent(p.id)}">
              <span class="tag">${esc(p.category)}</span>
              <span>${esc(p.title)}</span>
            </a>`).join("");
      }
    })();
  </script>
  <script src="menu.js"></script>
</body>
</html>
