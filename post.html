<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seven Gigs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="index.html"><i></i>Seven Gigs</a>
      <nav><a href="admin.html">Admin</a></nav>
    </div>
  </header>

  <main class="wrap post" id="post">
    <p class="empty">Gikarga pa...</p>
  </main>

  <footer>
    <div class="wrap">Seven Gigs</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script>
    (async function () {
      const box = document.getElementById("post");
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { box.innerHTML = '<a class="back" href="index.html">&larr; Balik sa tanan nga posts</a><p class="empty">Wala makita ang post.</p>'; return; }

      const { data, error } = await sb
        .from("gigs_posts")
        .select("title,category,content,created_at")
        .eq("id", id)
        .eq("published", true)
        .maybeSingle();

      if (error || !data) {
        box.innerHTML = '<a class="back" href="index.html">&larr; Balik sa tanan nga posts</a><p class="empty">Wala makita ang post.</p>';
        return;
      }

      document.title = data.title + " | Seven Gigs";
      box.innerHTML = `
        <a class="back" href="index.html">&larr; Balik sa tanan nga posts</a><br>
        <span class="tag">${esc(data.category)}</span>
        <h1>${esc(data.title)}</h1>
        <div class="meta">${fmtDate(data.created_at)}</div>
        <article class="body">${renderContent(data.content)}</article>`;
    })();
  </script>
</body>
</html>
